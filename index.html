<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodWaste - Professional Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="auth-section" class="container">
    <div id="loginForm" class="auth-box">
      <h2>Login</h2>
      <p>Welcome back! Please enter your details.</p>
      <input type="email" id="loginEmail" placeholder="Email Address" required />
      <input type="password" id="loginPass" placeholder="Password" required />
      <button type="button" onclick="auth.login()">Sign In</button>
      <p class="toggle-text">Don't have an account?
        <a href="#" onclick="toggleAuth()">Register here</a>
      </p>
    </div>

    <div id="registerForm" class="auth-box" style="display:none;">
      <h2>Create Account</h2>
      <input type="text" id="regName" placeholder="Full Name" required />
      <input type="email" id="regEmail" placeholder="Email Address" required />
      <input type="password" id="regPass" placeholder="Password" required />
      <select id="regRole">
        <option value="receiver">Receiver</option>
        <option value="donor">Donor</option>
      </select>
      <button type="button" onclick="auth.register()">Sign Up</button>
      <p class="toggle-text">Already a member?
        <a href="#" onclick="toggleAuth()">Login here</a>
      </p>
    </div>
  </div>

  <div id="dashboard-section" class="container" style="display:none;">
    <div class="header" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h2>Welcome, <span id="user-display-name">User</span>!</h2>
        <p>Role: <b id="user-display-role">N/A</b></p>
      </div>
      <button type="button" class="btn-logout" onclick="auth.logout()">Logout</button>
    </div>

    <hr />
    <div id="role-content"></div>
  </div>

  <!-- QR image generator (receiver side) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Camera QR scanner (donor side / separate page too) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
